name: Publish first successful edition

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/first-edition.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: oasis-v1.0.0-first-edition
  cancel-in-progress: false

jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test, build and verify static release
        run: npm run check:release
      - name: Prepare first edition ZIP and SHA256
        run: |
          cd dist
          zip -q -r ../oasis-defenders-v1.0.0-web.zip .
          cd ..
          sha256sum oasis-defenders-v1.0.0-web.zip | tee oasis-defenders-v1.0.0-web.zip.sha256
          test -s oasis-defenders-v1.0.0-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: first-edition-v1.0.0
          path: |
            oasis-defenders-v1.0.0-web.zip
            oasis-defenders-v1.0.0-web.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  publish-release:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: first-edition-v1.0.0
          path: release-files
      - name: Create fixed version tag and public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 exists; do not replace the published version."
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')"
            test "$TAG_SHA" = "$GITHUB_SHA" || { echo "::error::Release tag points to another commit"; exit 1; }
          else
            gh release create v1.0.0 \
              release-files/oasis-defenders-v1.0.0-web.zip \
              release-files/oasis-defenders-v1.0.0-web.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "حُماة الواحة — الطبعة الأولى الناجحة v1.0.0" \
              --notes-file FIRST_EDITION_RELEASE_NOTES.md \
              --latest
          fi
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  deploy-pages-if-configured:
    needs: [verify-and-package, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE_URL="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url' 2>/dev/null || true)"
          if [ -n "$SITE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages enabled: $SITE_URL"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; downloadable v1.0.0 is published. Set Settings > Pages > GitHub Actions, then rerun the workflow."
            echo "GitHub Pages is not enabled yet. Enable GitHub Actions in Settings > Pages and rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.detect.outputs.ready == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.detect.outputs.ready == 'true'
        id: deployment
