name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vite and test dependencies
        run: npm install --no-audit --no-fund
      - name: Run modular gameplay and campaign tests
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Verify built assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'assets/' dist/index.html
